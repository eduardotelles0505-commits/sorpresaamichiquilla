<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta para ti ❤️</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="estrellas"></div>

    <main class="contenedor">
        <div class="corazon">❤️</div>

        <h1>¿Quieres ser mi novia?</h1>

        <p class="subtitulo">
            Hay algo que quiero preguntarte desde hace tiempo...
        </p>

        <div class="botones">
            <button id="si">Sí ❤️</button>
            <button id="no">No 🥺</button>
        </div>

        <p id="mensaje"></p>
    </main>

    <div id="final" class="pantalla-final">
        <div class="contenido-final">
            <h1>¡Sabía que dirías que sí! ❤️</h1>
            <p>Quiero seguir creando momentos bonitos contigo ✨</p>

            <img src="foto.jpg" alt="Nosotros">

            <p class="te-quiero">💖 Me haces muy feliz 💖</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
